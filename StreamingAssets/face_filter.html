<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>U_Draw Face Filter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh;
           display: flex; justify-content: center; align-items: center; }
    #wrap { position: relative; display: inline-block; }
    video, canvas { display: block; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; }
    #status {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.55); padding: 8px 20px;
      border-radius: 999px; font-family: sans-serif; font-size: 15px;
      pointer-events: none; transition: opacity .3s;
    }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════
    //  调整这 6 个值，让面具特征点对准真实人脸
    // ═══════════════════════════════════════════════════════
    const MASK_LEFT_EYE_X  = 0.30;  // 左眼孔中心 X（0~1，占图片宽度比例）
    const MASK_RIGHT_EYE_X = 0.70;  // 右眼孔中心 X
    const MASK_EYE_Y       = 0.48;  // 双眼中心 Y（0~1，占图片高度比例）
    const MASK_MOUTH_X     = 0.50;  // 嘴孔中心 X
    const MASK_MOUTH_Y     = 0.75;  // 嘴孔中心 Y
    const SCALE_X          = 1.50;  // 水平拉宽（>1 变宽）
    const SCALE_Y          = 0.714; // 垂直压缩（<1 变短）
    // ═══════════════════════════════════════════════════════

    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const status = document.getElementById('status');

    const filterImg = new Image();
    filterImg.src   = '/filter.png?' + Date.now();
    let filterReady = false;
    filterImg.onload  = () => { filterReady = true; };
    filterImg.onerror = () => { status.textContent = 'Error: filter image not found'; };

    async function init() {
      status.textContent = 'Loading (1/2): Fetching models...';
      const MODEL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),
        faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL)
      ]);

      status.textContent = 'Loading (2/2): Starting camera...';
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
      });
      video.srcObject = stream;
      await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      status.textContent = 'Face your camera';
      detectLoop();
    }

    // 计算一组地标点的中心
    function mean(pts, start, end) {
      let x = 0, y = 0, n = end - start;
      for (let i = start; i < end; i++) { x += pts[i].x; y += pts[i].y; }
      return { x: x / n, y: y / n };
    }

    // 由三对点求仿射变换矩阵（canvas setTransform 格式）
    // 满足：src[i] → dst[i]
    function solveAffine(src, dst) {
      const [s0, s1, s2] = src;
      const [d0, d1, d2] = dst;
      const det = s0.x*(s1.y-s2.y) - s0.y*(s1.x-s2.x) + (s1.x*s2.y - s2.x*s1.y);
      if (Math.abs(det) < 1e-10) return null;
      const r0 = (s1.y-s2.y)/det, r1 = (s2.y-s0.y)/det, r2 = (s0.y-s1.y)/det;
      const r3 = (s2.x-s1.x)/det, r4 = (s0.x-s2.x)/det, r5 = (s1.x-s0.x)/det;
      const r6 = (s1.x*s2.y-s2.x*s1.y)/det;
      const r7 = (s2.x*s0.y-s0.x*s2.y)/det;
      const r8 = (s0.x*s1.y-s1.x*s0.y)/det;
      return {
        a: r0*d0.x + r1*d1.x + r2*d2.x,   // x' = a*x + c*y + e
        b: r0*d0.y + r1*d1.y + r2*d2.y,   // y' = b*x + d*y + f
        c: r3*d0.x + r4*d1.x + r5*d2.x,
        d: r3*d0.y + r4*d1.y + r5*d2.y,
        e: r6*d0.x + r7*d1.x + r8*d2.x,
        f: r6*d0.y + r7*d1.y + r8*d2.y
      };
    }

    async function detectLoop() {
      while (true) {
        await new Promise(r => requestAnimationFrame(r));
        if (video.readyState < 2) continue;

        const det = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks(true);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (det && filterReady) {
          status.style.opacity = '0';
          drawMask(det.landmarks.positions);
        } else {
          status.style.opacity = '1';
          status.textContent   = 'Face your camera';
        }
      }
    }

    function drawMask(pts) {
      // face-api 68点索引：36-41=左眼，42-47=右眼，48-59=嘴巴外圈
      const leftEye  = mean(pts, 36, 42);
      const rightEye = mean(pts, 42, 48);
      const mouth    = mean(pts, 48, 60);

      const IW = filterImg.naturalWidth, IH = filterImg.naturalHeight;

      // 面具图片里三个特征点的像素坐标
      const srcPts = [
        { x: IW * MASK_LEFT_EYE_X,  y: IH * MASK_EYE_Y   },
        { x: IW * MASK_RIGHT_EYE_X, y: IH * MASK_EYE_Y   },
        { x: IW * MASK_MOUTH_X,     y: IH * MASK_MOUTH_Y  }
      ];

      // 人脸检测得到的真实坐标（canvas 和 video 都有 CSS scaleX(-1)，
      // 所以直接用原始坐标，CSS 统一镜像，两者自动对齐）
      const dstPts = [ leftEye, rightEye, mouth ];

      const T = solveAffine(srcPts, dstPts);
      if (!T) return;

      // 水平以双眼中点为中心拉宽，垂直以三点重心为中心压缩
      const Cx = (dstPts[0].x + dstPts[1].x) / 2;
      const Cy = (dstPts[0].y + dstPts[1].y + dstPts[2].y) / 3;
      const a = SCALE_X * T.a;
      const b = SCALE_Y * T.b;
      const c = SCALE_X * T.c;
      const d = SCALE_Y * T.d;
      const e = SCALE_X * T.e + (1 - SCALE_X) * Cx;
      const f = SCALE_Y * T.f + (1 - SCALE_Y) * Cy;

      ctx.save();
      ctx.setTransform(a, b, c, d, e, f);
      ctx.globalAlpha = 0.92;
      ctx.drawImage(filterImg, 0, 0, IW, IH);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    init().catch(err => {
      status.textContent = 'Error: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
